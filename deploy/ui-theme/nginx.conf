# Reverse proxy that serves the OpenBao web UI with the Keyholder theme.
# It injects one same-origin stylesheet and serves the logo under /kh/, so
# OpenBao's Content-Security-Policy still holds. It proxies everything else
# untouched: the API, the login, the secrets. It only restyles the UI.
#
#   docker compose -f deploy/ui-theme/compose.yml up
#
# Point BAO_ADDR at this proxy (default http://127.0.0.1:8200). Over TLS,
# terminate it here or in front; see docs/server.md.

worker_processes 1;
events { worker_connections 256; }
http {
  include /etc/nginx/mime.types;
  sendfile on;
  # Upstream: the OpenBao server. Override with OPENBAO_ADDR at build time.
  upstream openbao { server openbao:8200; }

  server {
    listen 8200;

    # Keyholder assets: logo and theme. Same origin, so CSP 'self' allows them.
    location /kh/ {
      alias /srv/kh/;
      add_header Cache-Control "public, max-age=300";
      default_type image/svg+xml;
      types { text/css css; image/svg+xml svg; }
    }

    location / {
      proxy_pass http://openbao;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      # sub_filter cannot rewrite compressed bodies: ask upstream for plain.
      proxy_set_header Accept-Encoding "";
      # Inject the theme into the UI shell only (text/html).
      sub_filter '</head>' '<link rel="stylesheet" href="/kh/theme.css"></head>';
      sub_filter_once on;
      sub_filter_types text/html;
    }
  }
}
