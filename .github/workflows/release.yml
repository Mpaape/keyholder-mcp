name: Release

# Publishes keyholder-mcp and khcall for Linux, macOS and Windows (amd64 and
# arm64), with SHA256SUMS, as a GitHub release whose notes are the version's
# section of CHANGELOG.md. Two ways in:
#
# - push a tag vX.Y.Z: releases that tag;
# - merge to main a CHANGELOG.md whose newest "## X.Y.Z" section has no
#   release yet: creates the tag vX.Y.Z at that commit and releases it.
#
# Path filters are not evaluated for tag pushes, so a tag always runs.

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
    paths: [CHANGELOG.md]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Version
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            tag="${GITHUB_REF_NAME}"
          else
            ver="$(grep -m1 -oE '^## [0-9]+\.[0-9]+\.[0-9]+' CHANGELOG.md | cut -d' ' -f2 || true)"
            if [ -z "$ver" ]; then echo "no released version in CHANGELOG.md"; echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0; fi
            tag="v${ver}"
            if gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "$tag is already released"; echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
            fi
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"
      - if: steps.v.outputs.skip != 'true'
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Verify modules
        if: steps.v.outputs.skip != 'true'
        run: go mod verify
      - name: Test
        if: steps.v.outputs.skip != 'true'
        run: go test ./...
      - name: Build
        if: steps.v.outputs.skip != 'true'
        env:
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os="${target%/*}"; arch="${target#*/}"; ext=""; [ "$os" = windows ] && ext=".exe"
            name="keyholder-mcp_${version}_${os}_${arch}"
            mkdir -p "build/$name"
            for cmd in keyholder-mcp khcall; do
              CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath \
                -ldflags "-s -w -X main.version=${version}" \
                -o "build/$name/${cmd}${ext}" "./cmd/$cmd"
            done
            cp LICENSE README.md "build/$name/"
            if [ "$os" = windows ]; then
              (cd build && zip -qr "../dist/$name.zip" "$name")
            else
              tar -C build -czf "dist/$name.tar.gz" "$name"
            fi
          done
          (cd dist && sha256sum * > SHA256SUMS)
          cat dist/SHA256SUMS
      - name: Release notes from CHANGELOG.md
        if: steps.v.outputs.skip != 'true'
        env:
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          set -euo pipefail
          awk -v v="${TAG#v}" '
            $0 ~ "^## \\[?" v "\\]?( |$)" {on=1; next}
            on && /^## / {exit}
            on {print}
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "::error::no section for ${TAG#v} in CHANGELOG.md"; exit 1; }
      - name: Publish
        if: steps.v.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            gh release create "$TAG" dist/* --title "$TAG" --notes-file notes.md --verify-tag
          else
            gh release create "$TAG" dist/* --title "$TAG" --notes-file notes.md --target "$GITHUB_SHA"
          fi
