name: CI

# One pipeline: tests and tutorials first; on a pull request, the AurumCode
# gate runs only after both pass. Its verdict is the aurumcode/policy-gate
# status, required on main; AurumCode never approves a pull request
# (.aurumcode/config.yml, publication: comments).

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

concurrency:
  # Must differ from the reusable review job's own group
  # (aurumcode-review-<pr>), or GitHub cancels both as a deadlock.
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: go test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: go mod verify
        run: go mod verify
      - name: gofmt
        if: runner.os != 'Windows'
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: go vet
        run: go vet ./...
      # Failures become job annotations, visible on the PR without the log.
      - name: go test
        shell: bash
        run: |
          set -o pipefail
          if go test ./... 2>&1 | tee test.log; then exit 0; fi
          grep -E '^(--- FAIL|FAIL|panic:)|(_test|testing)\.go:[0-9]+:' test.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done
          exit 1
      - name: go build
        run: go build -o keyholder-mcp-bin ./cmd/keyholder-mcp

  # Runs every executable tutorial against a real OpenBao dev server and
  # fails when an output drifts from the recorded expected/ files.
  tutorials:
    name: tutorials
    runs-on: ubuntu-latest
    env:
      BAO_VERSION: 2.7.1
      BAO_SHA256: 0e2f1ce10d124e03112b50dd2fbec6b78003783253bc3a91587938f39d1e2243
      AWS_PLUGIN_TAG: secrets-aws-v0.3.1
      AWS_PLUGIN_SHA256: 23292ee38d49468423910e3646346c4ead3184abf757eee5e93f48704c93680a
      MOTO_VERSION: 5.2.4
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install OpenBao (checksum verified)
        run: |
          f="openbao_${BAO_VERSION}_linux_amd64.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$f" "https://github.com/openbao/openbao/releases/download/v${BAO_VERSION}/$f"
          echo "${BAO_SHA256}  $RUNNER_TEMP/$f" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bao"
          tar -xzf "$RUNNER_TEMP/$f" -C "$RUNNER_TEMP/bao" bao
          echo "$RUNNER_TEMP/bao" >> "$GITHUB_PATH"
      # The cloud tutorial: OpenBao's AWS secrets plugin against moto, a
      # local AWS emulator, and the aws and gcloud CLIs.
      - name: Install the AWS secrets plugin (checksum verified) and moto
        run: |
          f=openbao-plugin-secrets-aws_linux_amd64_v1
          curl -fsSLo "$RUNNER_TEMP/$f.tar.gz" "https://github.com/openbao/openbao-plugins/releases/download/${AWS_PLUGIN_TAG}/$f.tar.gz"
          echo "${AWS_PLUGIN_SHA256}  $RUNNER_TEMP/$f.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$f.tar.gz" -C "$RUNNER_TEMP" "$f"
          chmod +x "$RUNNER_TEMP/$f"
          echo "KH_AWS_PLUGIN=$RUNNER_TEMP/$f" >> "$GITHUB_ENV"
          pipx install "moto[server]==${MOTO_VERSION}"
          aws --version
          gcloud --version | head -1
      - name: Build binaries
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          go build -o "$RUNNER_TEMP/bin/keyholder-mcp" ./cmd/keyholder-mcp
          go build -o "$RUNNER_TEMP/bin/khcall" ./cmd/khcall
          echo "KH_BIN_DIR=$RUNNER_TEMP/bin" >> "$GITHUB_ENV"
      - name: Run tutorials and compare with expected/
        run: |
          bao version
          for t in quickstart access guardrails masking cloud; do
            echo "::group::$t"
            bash "demo/tutorials/$t/run.sh" all
            bash "demo/tutorials/$t/run.sh" --check
            echo "::endgroup::"
          done

  # Fails closed without a provider: without LLM_API_KEY/LLM_BASE_URL (fork or
  # Dependabot PR, or a deleted secret) the gate cannot run; this job posts the
  # reason on aurumcode/policy-gate as failure. Never posts success.
  provider:
    name: LLM provider configured
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - name: Fail closed without LLM secrets
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ -n "${LLM_API_KEY:-}" ] && [ -n "${LLM_BASE_URL:-}" ]; then
            echo "Provider configured; the aurumcode job posts aurumcode/policy-gate"
            exit 0
          fi
          reason="gate not run: secrets LLM_API_KEY and LLM_BASE_URL are missing"
          gh api --method POST "repos/${REPOSITORY}/statuses/${HEAD_SHA}" \
            -f state=failure -f context=aurumcode/policy-gate \
            -f description="${reason}" >/dev/null ||
            echo "::warning::could not post the aurumcode/policy-gate status"
          echo "::error::${reason}"
          exit 1

  # The AurumCode gate: project rules (.aurumcode/, read from the base
  # branch), the deterministic security pass, gitleaks, Semgrep and go vet.
  aurumcode:
    name: AurumCode gate
    needs: [test, tutorials, provider]
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
      statuses: write
      checks: read
    uses: Mpaape/AurumCode/.github/workflows/review.yml@v2.0.0
    with:
      model: ${{ vars.LLM_MODEL }}
      provider: ${{ vars.LLM_PROVIDER }}
      # Fallback: tried only when the primary provider fails.
      fallback_1_provider: ${{ vars.LLM_FALLBACK_1_PROVIDER }}
      fallback_1_model: ${{ vars.LLM_FALLBACK_1_MODEL }}
      security: true
      # Report as a comment, never a formal review: the gate never approves.
      # Set here so it holds whatever the base branch's config says.
      publication: comments
    # Only what the gate uses, never secrets: inherit.
    secrets:
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
      LLM_FALLBACK_1_API_KEY: ${{ secrets.LLM_FALLBACK_1_API_KEY }}
      LLM_FALLBACK_1_BASE_URL: ${{ secrets.LLM_FALLBACK_1_BASE_URL }}

  # SARIF to the Security tab (code scanning). Fork PRs do not get the
  # permission: the if skips this and the SARIF stays an artifact.
  upload-sarif:
    name: SARIF to the Security tab
    needs: aurumcode
    if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && needs.aurumcode.result != 'skipped' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      # A gate that stops before writing its SARIF (for example on a
      # configuration error) uploads no artifact: skip instead of failing.
      - name: Check the SARIF artifact exists
        id: sarif
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          NAME: aurumcode-sarif-${{ github.event.pull_request.number }}
        run: |
          n="$(gh api "repos/${REPOSITORY}/actions/runs/${RUN_ID}/artifacts" --jq "[.artifacts[] | select(.name == \"${NAME}\")] | length")"
          if [ "${n}" -gt 0 ]; then echo "found=true" >> "$GITHUB_OUTPUT"; else
            echo "::notice::the gate wrote no SARIF; nothing to upload"; echo "found=false" >> "$GITHUB_OUTPUT"; fi
      - if: steps.sarif.outputs.found == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: aurumcode-sarif-${{ github.event.pull_request.number }}
          path: .
      - if: steps.sarif.outputs.found == 'true'
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: aurumcode-review.sarif
          category: aurumcode-policy-gate
