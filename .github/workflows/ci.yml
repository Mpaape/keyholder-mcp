name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: go test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # O go.sum ainda não está no repositório: o tidy o gera aqui, verificado
      # pelo checksum database do Go. Remover este passo quando ele for commitado.
      - name: go mod tidy
        run: go mod tidy
      - name: gofmt
        if: runner.os != 'Windows'
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: go vet
        run: go vet ./...
      # Falhas viram anotações do job, visíveis no PR sem abrir o log.
      - name: go test
        shell: bash
        run: |
          set -o pipefail
          if go test ./... 2>&1 | tee test.log; then exit 0; fi
          grep -E '^(--- FAIL|FAIL|panic:)|(_test|testing)\.go:[0-9]+:' test.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done
          exit 1
      - name: go build
        run: go build -o keyholder-mcp-bin ./cmd/keyholder-mcp
