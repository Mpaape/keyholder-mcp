name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: go test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: go mod verify
        run: go mod verify
      - name: gofmt
        if: runner.os != 'Windows'
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: go vet
        run: go vet ./...
      # Failures become job annotations, visible on the PR without the log.
      - name: go test
        shell: bash
        run: |
          set -o pipefail
          if go test ./... 2>&1 | tee test.log; then exit 0; fi
          grep -E '^(--- FAIL|FAIL|panic:)|(_test|testing)\.go:[0-9]+:' test.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done
          exit 1
      - name: go build
        run: go build -o keyholder-mcp-bin ./cmd/keyholder-mcp

  # Runs every executable tutorial against a real OpenBao dev server and
  # fails when an output drifts from the recorded expected/ files.
  tutorials:
    name: tutorials
    runs-on: ubuntu-latest
    env:
      BAO_VERSION: 2.7.1
      BAO_SHA256: 0e2f1ce10d124e03112b50dd2fbec6b78003783253bc3a91587938f39d1e2243
      AWS_PLUGIN_TAG: secrets-aws-v0.3.1
      AWS_PLUGIN_SHA256: 23292ee38d49468423910e3646346c4ead3184abf757eee5e93f48704c93680a
      MOTO_VERSION: 5.2.4
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install OpenBao (checksum verified)
        run: |
          f="openbao_${BAO_VERSION}_linux_amd64.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$f" "https://github.com/openbao/openbao/releases/download/v${BAO_VERSION}/$f"
          echo "${BAO_SHA256}  $RUNNER_TEMP/$f" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bao"
          tar -xzf "$RUNNER_TEMP/$f" -C "$RUNNER_TEMP/bao" bao
          echo "$RUNNER_TEMP/bao" >> "$GITHUB_PATH"
      # The cloud tutorial: OpenBao's AWS secrets plugin against moto, a
      # local AWS emulator, and the aws and gcloud CLIs.
      - name: Install the AWS secrets plugin (checksum verified) and moto
        run: |
          f=openbao-plugin-secrets-aws_linux_amd64_v1
          curl -fsSLo "$RUNNER_TEMP/$f.tar.gz" "https://github.com/openbao/openbao-plugins/releases/download/${AWS_PLUGIN_TAG}/$f.tar.gz"
          echo "${AWS_PLUGIN_SHA256}  $RUNNER_TEMP/$f.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$f.tar.gz" -C "$RUNNER_TEMP" "$f"
          chmod +x "$RUNNER_TEMP/$f"
          echo "KH_AWS_PLUGIN=$RUNNER_TEMP/$f" >> "$GITHUB_ENV"
          pipx install "moto[server]==${MOTO_VERSION}"
          aws --version
          gcloud --version | head -1
      - name: Build binaries
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          go build -o "$RUNNER_TEMP/bin/keyholder-mcp" ./cmd/keyholder-mcp
          go build -o "$RUNNER_TEMP/bin/khcall" ./cmd/khcall
          echo "KH_BIN_DIR=$RUNNER_TEMP/bin" >> "$GITHUB_ENV"
      - name: Run tutorials and compare with expected/
        run: |
          bao version
          for t in quickstart access guardrails masking cloud; do
            echo "::group::$t"
            bash "demo/tutorials/$t/run.sh" all
            bash "demo/tutorials/$t/run.sh" --check
            echo "::endgroup::"
          done
