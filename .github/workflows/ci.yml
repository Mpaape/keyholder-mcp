name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: go test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # go.sum is not in the repository yet: tidy creates it here, checked
      # against the Go checksum database. Drop this step once it is committed.
      - name: go mod tidy
        run: go mod tidy
      - name: gofmt
        if: runner.os != 'Windows'
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: go vet
        run: go vet ./...
      # Failures become job annotations, visible on the PR without the log.
      - name: go test
        shell: bash
        run: |
          set -o pipefail
          if go test ./... 2>&1 | tee test.log; then exit 0; fi
          grep -E '^(--- FAIL|FAIL|panic:)|(_test|testing)\.go:[0-9]+:' test.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done
          exit 1
      - name: go build
        run: go build -o keyholder-mcp-bin ./cmd/keyholder-mcp
      # Until go.sum is committed, publish the one tidy just verified against
      # the Go checksum database, so it can be reviewed and committed.
      - name: Report generated go.sum
        if: runner.os == 'Linux' && hashFiles('go.sum') != '' 
        shell: bash
        run: |
          if git ls-files --error-unmatch go.sum >/dev/null 2>&1; then exit 0; fi
          # Annotations are cut at 4 KiB: publish 30 lines per notice.
          total="$(wc -l < go.sum)"
          split -l 30 -d go.sum part.
          n=0
          for f in part.*; do
            n=$((n+1))
            msg="$(sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g' "$f")"
            echo "::notice title=go.sum part ${n} (${total} lines)::${msg}"
          done

  # Runs every executable tutorial against a real OpenBao dev server and
  # fails when an output drifts from the recorded expected/ files.
  tutorials:
    name: tutorials
    runs-on: ubuntu-latest
    env:
      BAO_VERSION: 2.7.1
      BAO_SHA256: 0e2f1ce10d124e03112b50dd2fbec6b78003783253bc3a91587938f39d1e2243
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: go mod tidy
        run: go mod tidy
      - name: Install OpenBao (checksum verified)
        run: |
          f="openbao_${BAO_VERSION}_linux_amd64.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$f" "https://github.com/openbao/openbao/releases/download/v${BAO_VERSION}/$f"
          echo "${BAO_SHA256}  $RUNNER_TEMP/$f" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bao"
          tar -xzf "$RUNNER_TEMP/$f" -C "$RUNNER_TEMP/bao" bao
          echo "$RUNNER_TEMP/bao" >> "$GITHUB_PATH"
      - name: Build binaries
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          go build -o "$RUNNER_TEMP/bin/keyholder-mcp" ./cmd/keyholder-mcp
          go build -o "$RUNNER_TEMP/bin/khcall" ./cmd/khcall
          echo "KH_BIN_DIR=$RUNNER_TEMP/bin" >> "$GITHUB_ENV"
      - name: Run tutorials and compare with expected/
        run: |
          bao version
          for t in quickstart access guardrails masking; do
            echo "::group::$t"
            bash "demo/tutorials/$t/run.sh" all
            bash "demo/tutorials/$t/run.sh" --check
            echo "::endgroup::"
          done
