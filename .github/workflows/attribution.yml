name: No AI attribution

# The maintainer's own guard: removes AI attribution footers and trailer lines
# from the repository owner's pull requests, issues and comments, and fails the
# owner's pull requests whose commits carry them. Anyone else's content is left
# alone. Patterns: scripts/attribution/patterns.txt.
#
# pull_request_target runs the base branch's copy of this workflow and of
# guard.py; the pull request's code is never checked out or run.

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created, edited]
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: attribution-${{ github.event.pull_request.number || github.event.issue.number || github.run_id }}
  cancel-in-progress: false

jobs:
  guard:
    name: No AI attribution
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.comment.user.login || github.event.pull_request.user.login || github.event.issue.user.login) == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v7.0.1; the base branch, never the PR head.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Clean bodies and check commits
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/attribution/guard.py
