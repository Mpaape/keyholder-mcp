name: AurumCode review

# Reviews each PR with AurumCode, using the rules in .aurumcode/ (read from
# the base branch). Same secrets and variables as the Mpaape/AurumCode repo.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  statuses: write
  checks: read

concurrency:
  group: aurumcode-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    uses: Mpaape/AurumCode/.github/workflows/review.yml@v2.0.0
    with:
      model: ${{ vars.LLM_MODEL }}
      provider: ${{ vars.LLM_PROVIDER }}
      # Fallback: tried only when the primary provider fails.
      fallback_1_provider: ${{ vars.LLM_FALLBACK_1_PROVIDER }}
      fallback_1_model: ${{ vars.LLM_FALLBACK_1_MODEL }}
      security: true
    # Only what the review uses, never secrets: inherit.
    secrets:
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
      LLM_FALLBACK_1_API_KEY: ${{ secrets.LLM_FALLBACK_1_API_KEY }}
      LLM_FALLBACK_1_BASE_URL: ${{ secrets.LLM_FALLBACK_1_BASE_URL }}

  # SARIF to the Security tab (code scanning). Fork PRs do not get the
  # permission: the if skips this and the SARIF stays an artifact.
  upload-sarif:
    name: SARIF to the Security tab
    needs: review
    if: ${{ !cancelled() && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: aurumcode-sarif-${{ github.event.pull_request.number }}
          path: .
      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: aurumcode-review.sarif
          category: aurumcode-policy-gate

  # Fails closed without a provider: without LLM_API_KEY/LLM_BASE_URL (fork or
  # Dependabot PR, or a deleted secret) the review does not run; this job
  # posts the reason on aurumcode/policy-gate as failure. Never posts success.
  provider:
    name: LLM provider configured
    runs-on: ubuntu-latest
    steps:
      - name: Fail closed without LLM secrets
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ -n "${LLM_API_KEY:-}" ] && [ -n "${LLM_BASE_URL:-}" ]; then
            echo "Provedor configurado; o job review publica aurumcode/policy-gate"
            exit 0
          fi
          reason="review not run: secrets LLM_API_KEY and LLM_BASE_URL are missing"
          gh api --method POST "repos/${REPOSITORY}/statuses/${HEAD_SHA}" \
            -f state=failure -f context=aurumcode/policy-gate \
            -f description="${reason}" >/dev/null ||
            echo "::warning::could not post the aurumcode/policy-gate status"
          echo "::error::${reason}"
          exit 1
