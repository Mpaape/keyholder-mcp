# AurumCode configuration for Keyholder MCP, in the same shape as AurumCode's
# own .aurumcode/config.yml.
# Reference: https://github.com/Mpaape/AurumCode/blob/v2.0.0/docs/configuration.md
# Project rules: .aurumcode/skills/<name>/SKILL.md; each "## " becomes a rule
# citable as <name>#<slug>, and "severity: error" in it fails the gate.
review:
  language: en-US
  publication: comments   # report as a PR comment; never approves. The verdict is the aurumcode/policy-gate status
  inline_comments: true   # blocking findings and one-click suggestions on the line

gate:
  fail_on: [error]        # an error finding (model, skill or scanner) fails
  inconclusive: block     # a review that did not finish never passes

quality_gates:
  scanners:
    - engine: gitleaks    # secrets anywhere in the PR's commits
      required: true
    - engine: semgrep     # SAST: fails only on lines the PR added
    - engine: govet       # go vet on the packages the PR touches
      fail_on: warning

deliberation:
  enabled: true           # the model may read repository files, within limits
  max_rounds: 3
  max_cost_tokens: 60000
  per_tool_timeout_seconds: 120

# Reviewed false positives. Each exception covers only the exact rule and file
# and expires on its own. Real secrets are still covered by gitleaks.
exceptions:
  - repo: Mpaape/keyholder-mcp
    rule: analysis/hardcoded-secret
    path: internal/bao/bao.go
    owner: Mpaape
    reason: EnvWrappingToken and EnvToken hold environment variable names (BAO_WRAPPING_TOKEN, BAO_TOKEN), not secrets
    expires: 2027-04-13
